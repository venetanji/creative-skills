[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creative-comfy-graph"
version = "0.1.0"
description = "Standalone standard-library ComfyUI graph primitives"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/creative_comfy_graph"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LTX-PROFILES.md", "/H3-PROFILE.md", "/RECOVERY.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
markers = ["artifact_driver: outer artifact build/environment orchestration (excluded from wheel tests)"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "tests/tools/build_sdist.py"
